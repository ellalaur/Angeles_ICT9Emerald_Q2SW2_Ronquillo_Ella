<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Seatwork 2</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
	ul {
		list-style-type: none;
		margin: 0;
		padding: 0;
	}

	nav {
		background-color: #2e2e2e;
		padding: 20px;
	}

	nav ul {
		margin: 0;
		padding: 0;
		display: flex;
		gap: 30px;
		font-size: 24px;
	}

	nav a {
		color: white;
		text-decoration: none;
	}

	nav a:hover {
		color: grey;
		text-decoration: underline;
	}

	nav input[type="text"] {
		height: 45px;
		width: 200px;
		margin-right: 10px;
		padding-left: 15px;
		border-radius: 10px;
	}

	nav input[type="submit"] {
		height: 45px;
		width: 90px;
		background-color: #7c98c4;
		border-radius: 10px;
	}

	img {
		width: 50px;
		height: 50px;
		border-radius: 100%;
	}

	p {
		font-size: 20px;
	}

	li {
		padding-left: 20px;
	}


	.contact-box {
		width: 100%;
	}

	@media (min-width: 992px) {
		.contact-box {
			width: 350px;
			flex-shrink: 0;
		}
	}

	@media (max-width: 991px) {
		nav ul {
			flex-direction: column;
			gap: 15px;
			margin-top: 15px;
			margin-bottom: 15px;
		}

		nav form {
			margin-top: 15px;
		}
	}

</style>
</head>
<body style="background-image: url(yasyas.jpeg); background-size: cover; background-attachment: fixed;">

<div class="image-bg">
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container-fluid">
			<img src="images.jpeg" alt="Logo">
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#Menu">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse justify-content-between" id="Menu">
				<ul>
					<li><a href="contact.asp">Contact Us</a></li>
				</ul>

				<form class="d-flex">
					<input type="text" id="search" name="search" placeholder="search . . .">
					<input type="submit" value="Submit">
				</form>
			</div>
		</div>
	</nav>

	<div class="container-fluid" style="margin-top: 120px;">
		<div class="d-flex flex-column flex-lg-row align-items-start" style="gap: 20px;">
			
			<div class="w-100">
				<div class="bg-white p-3 rounded mb-3">
					<h2 class="m-0">School Office Hours</h2>
				</div>

				<div class="table-responsive">
					<table class="table table-bordered bg-white">
						<thead>
							<tr class="table-primary">
								<th>Day</th>
								<th>Office Hours</th>
								<th>Department</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>Monday</td>
								<td>8:00 AM - 4:00 PM</td>
								<td>Registrar's Office</td>
							</tr>
							<tr>
								<td>Tuesday</td>
								<td>8:00 AM - 4:00 PM</td>
								<td>Accounting Office</td>
							</tr>
							<tr>
								<td>Wednesday</td>
								<td>8:00 AM - 4:00 PM</td>
								<td>Guidance Office</td>
							</tr>
							<tr>
								<td>Thursday</td>
								<td>8:00 AM - 4:00 PM</td>
								<td>Principal's Office</td>
							</tr>
							<tr>
								<td>Friday</td>
								<td>8:00 AM - 4:00 PM</td>
								<td>Admin Office</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="bg-light p-4 rounded contact-box">
				<h4 class="text-center mb-3">Contact Us</h4>
				<form>
					<label class="form-label">Full Name</label>
					<input type="text" class="form-control mb-3" placeholder="Enter your full name">

					<label class="form-label">Email Address</label>
					<input type="email" class="form-control mb-3" placeholder="Enter your email">

					<label class="form-label">Subject</label>
					<input type="text" class="form-control mb-3" placeholder="Enter subject">

					<label class="form-label">Message</label>
					<textarea class="form-control mb-3" rows="3" placeholder="Type your message here"></textarea>

					<button type="submit" class="btn btn-primary w-100">Send Message</button>
				</form>
			</div>
		</div>
	</div>
</div>

</body>
</html>
